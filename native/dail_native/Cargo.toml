[package]
name = "dail-native"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Optional PyO3 acceleration trials for dail_extractor"
publish = false

[lib]
name = "_dail_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rayon = "1.11.0"
regex = "1.12.2"
unicode-normalization = "0.1.24"
