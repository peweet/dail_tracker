name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/build_doc_index.py --check
      - run: uv run python tools/check_mcp_catalog.py
      - name: Check live frontend migration contracts
        run: |
          uv run python tools/migration/extract_url_contract.py --check
          uv run python tools/migration/extract_class_contract.py --check
          uv run python tools/migration/scan_framework_coupling.py --check-markup

  # Dependency truth: pyproject.toml (human intent) → uv.lock (resolved env) →
  # requirements.txt (app-runtime export for Streamlit Cloud / pip fallback).
  # This job proves all three stay in sync: the lock is current with pyproject,
  # AND requirements.txt is a faithful export of the lock. A forgotten re-lock or
  # a hand-edited requirements.txt fails the PR instead of silently shipping the
  # deployed app on different versions than CI tested.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "0.11.16"   # pin: keeps `uv export` output byte-stable for the diff guard
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - name: requirements.txt is a current export of uv.lock (app runtime only)
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-default-groups -o requirements.txt
          git diff --exit-code -- requirements.txt

  # Streamlit logic firewall: the UI/data-access layer must read registered
  # views only — no raw parquet/CSV reads, joins, or rollups (a sanctioned
  # render-time aggregation is exempted inline with `# logic_firewall:
  # display_only`). The checker is pure-stdlib AST, so a core sync is enough.
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python tools/check_streamlit_logic_firewall.py
      # Leak guard: block private siting IP / secrets from the public repo. Same
      # script as the versioned .githooks/pre-push hook. See tools/check_no_private_ip.py.
      - run: uv run python tools/check_no_private_ip.py

  # Secret scan (gitleaks): full-history scan with the repo config
  # (.gitleaks.toml allowlists + .gitleaksignore grandfathered fingerprints —
  # baselined 2026-08-01 at zero real secrets across 1,015 commits). Also runs
  # locally via .githooks/pre-push when gitleaks is installed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the checkout
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # basedpyright resolves third-party imports from .venv (see the venv keys
      # in [tool.basedpyright]). The app runtime (duckdb/streamlit/…) is core; the
      # dev group adds basedpyright and the pipeline extra adds polars/requests/…,
      # so every in-scope import resolves. Scope + rules live in pyproject.toml.
      - run: uv sync --frozen --extra pipeline --extra api --group dev
      # Scoped to services/ + pure-logic modules; fails on any NEW type error.
      - run: uv run basedpyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # API and MCP are explicit so their module-level import guards cannot
      # silently turn missing capability tests into a green CI run.
      - run: uv sync --frozen --extra pipeline --extra api --extra mcp --group dev
      - name: Assert required test capabilities are importable
        run: uv run python -c "import fastapi, jedi, mcp, sqlglot"
      # Expected-failure ledger (test/expected_failures.yaml): environment-dependent
      # failures only — schema-validated here so an entry without a reason/evidence/
      # resolution fails the PR. Applied entries are printed by test/conftest.py in
      # the pytest terminal summary; a ledgered test that passes shows as STALE.
      - run: uv run python tools/check_expected_failures.py
      # Skip markers that can't run in the default lane:
      #   integration / bronze — need committed pipeline output beyond gold.
      #   sql — runs in its own `sql-contracts` job below (against committed gold).
      #   sources — external network. Source-URL health runs on a schedule via
      #     .github/workflows/nightly.yml (pdf_endpoint_check.py), not here.
      # Coverage is a BACKSLIDE RATCHET, not a target. The floor sits just under the
      # measured figure (40% at time of writing) so ordinary churn doesn't flap the build,
      # while a change that deletes or bypasses a meaningful chunk of tested code fails the
      # PR. What counts as "covered" is pinned in [tool.coverage.run] in pyproject.toml —
      # an explicit list of shipped trees, NOT ".", so a 0%-covered sandbox script can never
      # dilute the number and mask a real regression in shipped code.
      #
      # Coverage here is deliberately uneven by layer: the serving/core layer is well covered
      # (api ~92%, dail_tracker_core ~82%, services ~74%), the ingest layer is thin
      # (extractors ~32%, iris ~28%). RAISE the floor when a tree genuinely improves; never
      # lower it to turn a red build green.
      - run: >-
          uv run pytest -m "not integration and not sql and not sources and not bronze" -v
          --cov --cov-report=term-missing:skip-covered --cov-fail-under=38

  # Build what users actually install, run it away from the source checkout,
  # and boot the API image. Source-tree tests cannot catch missing wheel or
  # Docker resources.
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra pipeline --extra api --extra mcp --group dev
      - name: Build and install the wheel artifact
        run: |
          uv build --wheel
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Smoke-test installed entry points outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/dail-data"
          export DAIL_DATA_DIR="$RUNNER_TEMP/dail-data"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tools/build_delivery_smoke_fixture.py" --data-dir "$DAIL_DATA_DIR"
          "$GITHUB_WORKSPACE/.venv/bin/dail-pipeline" --list
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import os; from pathlib import Path; from config import DATA_DIR; assert DATA_DIR == Path(os.environ['DAIL_DATA_DIR']).resolve(); import mcp_server.server"
          "$GITHUB_WORKSPACE/.venv/bin/uvicorn" api.main:app --host 127.0.0.1 --port 8091 >"$RUNNER_TEMP/wheel-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8091/v1/health >/dev/null; then
              kill "$api_pid"
              wait "$api_pid" || true
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wheel-api.log"
          exit 1
      - name: Build API image
        run: docker build --tag dailtracker-api:ci .
      - name: Smoke-test API image as its non-root user
        run: |
          test "$(docker run --rm dailtracker-api:ci id -u)" != "0"
          container_id="$(docker run --detach --publish 8080:8080 dailtracker-api:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  # SQL view contract suite (~80 tests): executes every registered view against
  # the committed gold parquet under data/gold/ (un-gitignored), so it gates PRs
  # without a pipeline build. DAIL_INTEGRATION_TESTS=1 points the view loader at
  # the real committed data instead of the small CI fixtures. A column rename or
  # cast break in any view now fails CI instead of shipping a silently-empty page.
  sql-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra pipeline --group dev
      # Guard against a silent all-skip pass: if the committed gold is ever
      # re-gitignored, the contract tests would skip and the job would go falsely
      # green. Fail loudly instead.
      - name: Assert committed gold is present
        run: test -f data/gold/parquet/current_dail_vote_history.parquet
      # Completeness guard: the committed gold must not have silently lost rows or
      # columns vs data/_meta/output_baseline.json. Catches a PDF/layout/schema drift
      # that parsed clean but shipped partial data. An intended change re-baselines via
      # `python tools/check_output_regressions.py --update-baseline` (commit the JSON).
      - name: Gold completeness guard (no silent row/column regression)
        run: uv run python tools/check_output_regressions.py --strict
      # Content guard: rows+columns can be intact while the DATA rots — a column going
      # all-null, duplicate rows multiplying, mojibake/sentinels leaking in. Flags only a
      # REGRESSION vs data/_meta/gold_quality_baseline.json (accepts today's known quirks,
      # catches tomorrow's drift). Re-baseline an intended change via
      # `python tools/check_gold_quality.py --update-baseline` (commit the JSON).
      - name: Gold content-quality guard (no silent content drift)
        run: uv run python tools/check_gold_quality.py --strict
      # Match-rate guard: rows+columns+content can all look sane while a source's PDF/HTML
      # layout drift silently degrades the extracted FIELDS — the parser keeps running and
      # keeps producing the same row count, but the matched-vs-total ratios collapse. Compares
      # the ratios extractors publish to data/_meta/*_coverage.json against
      # data/_meta/extraction_quality_baseline.json. Re-baseline an intended change via
      # `python tools/check_extraction_quality.py --update-baseline` (commit the JSON).
      - name: Extraction match-rate guard (no silent field degradation)
        run: uv run python tools/check_extraction_quality.py --strict
      - run: uv run pytest -m sql -q
        env:
          DAIL_INTEGRATION_TESTS: "1"
