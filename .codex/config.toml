project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
hooks = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[memories]
generate_memories = false
use_memories = true
disable_on_external_context = true

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/hooks/session_context.py"'
command_windows = 'powershell.exe -WindowStyle Hidden -NoLogo -NoProfile -NonInteractive -Command "$repo = git rev-parse --show-toplevel; if ($LASTEXITCODE -eq 0) { & (Join-Path $repo .venv/Scripts/python.exe) (Join-Path $repo tools/hooks/session_context.py) }"'
timeout = 15
statusMessage = "Loading bounded project status"
additionalContextLimit = 1600

[[hooks.PreToolUse]]
matcher = "^(Agent|spawn_agent)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/hooks/guard_subagent_spawn.py"'
command_windows = 'powershell.exe -WindowStyle Hidden -NoLogo -NoProfile -NonInteractive -Command "$repo = git rev-parse --show-toplevel; if ($LASTEXITCODE -eq 0) { & (Join-Path $repo .venv/Scripts/python.exe) (Join-Path $repo tools/hooks/guard_subagent_spawn.py) }"'
timeout = 5
statusMessage = "Validating subagent contract"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/tools/hooks/closeout_gate.py"'
command_windows = 'powershell.exe -WindowStyle Hidden -NoLogo -NoProfile -NonInteractive -Command "$repo = git rev-parse --show-toplevel; if ($LASTEXITCODE -eq 0) { & (Join-Path $repo .venv/Scripts/python.exe) (Join-Path $repo tools/hooks/closeout_gate.py) }"'
timeout = 10
statusMessage = "Checking for a durable project lesson"

[mcp_servers.dail-tracker]
enabled = true
required = false
command = "uv"
args = [
    "run",
    "--frozen",
    "--extra",
    "mcp",
    "python",
    "mcp_server/server.py",
]
startup_timeout_sec = 360.0
tool_timeout_sec = 360.0
default_tools_approval_mode = "auto"
disabled_tools = [
    "search_planning_precedents",
    "siting_check",
    "siting_decision_documents",
]

[mcp_servers.dail-tracker.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"

[mcp_servers.siting_private]
enabled = false
required = false
command = "uv"
args = [
    "run",
    "--frozen",
    "--extra",
    "mcp",
    "--extra",
    "siting",
    "python",
    "planning/product/mcp/server.py",
]
startup_timeout_sec = 360.0
tool_timeout_sec = 360.0
default_tools_approval_mode = "auto"

[mcp_servers.siting_private.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"

[mcp_servers.next-devtools]
command = "npx"
args = [
    "-y",
    "next-devtools-mcp@latest",
]

[mcp_servers.siting-private]
command = "uv"
args = [
    "run",
    "--frozen",
    "--extra",
    "mcp",
    "--extra",
    "siting",
    "python",
    "planning/product/mcp/server.py",
]

[mcp_servers.siting-private.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"

[mcp_servers.storybook-siting]
url = "http://127.0.0.1:6006/mcp"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
OPENBLAS_NUM_THREADS = "4"
OMP_NUM_THREADS = "4"
MKL_NUM_THREADS = "4"
NUMEXPR_NUM_THREADS = "4"
