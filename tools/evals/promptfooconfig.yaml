# Promptfoo regression gate over the provider-neutral bench harnesses.
#
# Wraps the three probe scripts as exec providers and asserts on their printed
# summaries/scores. Each eval run SPENDS REAL API MONEY (~$0.60 routing, ~$1.50
# per bench arm at 2026-07 prices [Reported — measured probe costs in
# project_efficiency_build_2026_07_25]) — run after harness/project-guidance changes,
# not in CI on every commit.
#
# Run:  promptfoo eval -c tools/evals/promptfooconfig.yaml
# View: promptfoo view
#
# Select the backend with DAIL_EVAL_PROVIDER=codex|claude|auto and optionally
# pin DAIL_EVAL_MODEL / DAIL_EVAL_REASONING_EFFORT. Run paid probes deliberately
# from a plain terminal, not from CI or another agent session.

description: "Dáil Tracker harness regression: routing + package + counterfactual benches"

# Exec providers carry the FULL command in the id string — promptfoo spawns
# everything after 'exec: '. A config.command key is silently ignored (the
# 2026-07-31 ENOENT failure: it spawned the bare id suffix 'routing'). Paths are
# ABSOLUTE because promptfoo does not spawn from the repo root (relative
# .venv\Scripts\python also ENOENTed); machine-specific by design — this gate is
# local tooling, not CI. The probes locate the repo from __file__, so cwd is moot.
providers:
  - 'exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\routing_probe.py --require-all'
  - 'exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\package_bench.py --require-perfect newtools'
  - 'exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\harness_bench.py --require-perfect on'

prompts:
  - "{{task}}"   # probes ignore stdin; tasks are baked into each script

tests:
  - description: "Project guidance steers navigation-first (3/3 probes)"
    vars: { task: routing }
    providers: ['exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\routing_probe.py --require-all']
    assert:
      - type: contains
        value: "SUMMARY: 3/3"

  - description: "New tools score 1.0 on every task (fail-closed via --require-perfect)"
    vars: { task: package }
    providers: ['exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\package_bench.py --require-perfect newtools']
    assert:
      - type: not-contains
        value: '"score": 0.0'

  - description: "Full-stack arm answers all 5 counterfactual tasks correctly"
    vars: { task: harness }
    providers: ['exec: C:\Users\pglyn\PycharmProjects\dail_extractor\.venv\Scripts\python.exe C:\Users\pglyn\PycharmProjects\dail_extractor\tools\evals\harness_bench.py --require-perfect on']
    assert:
      - type: not-contains
        value: '"score": 0.0'
      - type: not-contains
        value: '"error"'
