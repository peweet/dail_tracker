non_defaults:
- Do not add embeddings, a vector database or a learned reranker without measured lexical-retrieval misses.
- Do not use a literal multi-pattern matcher as a substitute for relevance search or an ordered classifier.
- Do not add an always-on agent service, scheduler or second task ledger solely because the session is long.
- Do not copy installed plugin lists, model aliases, local absolute paths or private configuration into another
  machine blindly.
- Do not bulk-copy personal memories or transcript archives into shared repository context.
- Do not treat read-only annotations, ignore files or prose rules as a substitute for real authorization boundaries.
