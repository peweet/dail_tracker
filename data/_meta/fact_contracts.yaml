# Hand-curated SEMANTIC contract for silver/gold money facts.
#
# Merged into data/_meta/fact_cards.json by tools/build_fact_cards.py and served to
# agents via the `describe_dataset` / `list_datasets` MCP tools. This is the
# deterministic semantic layer over the data — the 3-money-grain never-sum rule,
# encoded as data an agent reads, not prose it might miss.
#
# ONLY semantic fields belong here. Mechanical fields (columns, column_types, rows,
# size_bytes, year_span, read_by) are auto-derived from the parquet footer — never
# hand-author them; doing so reintroduces drift.
#
# Replaces the legacy fact_grain.csv, whose unquoted commas in grain strings like
# "(council,year,division)" corrupted 4 cards. YAML plain scalars hold commas, €,
# and em-dashes without quoting, and this format extends to join_key/caveat later.
#
# CI guard: `python tools/build_fact_cards.py --check` fails if any entry here names
# a fact with no matching parquet (contract drift).
#
# Fields:
#   grain          one row per WHAT — the unit of a row
#   money_grain    the money class: awarded | payments | budget | accounts |
#                  allowance | political_finance | estimate  (never sum across classes)
#   never_sum_with pipe-joined list of money_grains this must NOT be summed/unioned with
#   purpose        one line an agent can quote back

procurement_awards:
  grain: "one row per awarded contract/lot"
  money_grain: awarded
  never_sum_with: payments|budget|ted
  purpose: "Contract AWARDS from eTenders/OGP — the ceiling awarded, NOT cash paid"

procurement_payments_fact:
  grain: "one row per disclosed payment/PO line"
  money_grain: payments
  never_sum_with: awarded|budget|ted
  purpose: "Actual purchase-order/payment lines >€20k from public bodies + councils"

procurement_notices:
  grain: "one row per eTenders notice (awarded or not)"
  money_grain: estimate
  never_sum_with: awarded|payments|budget|ted|accounts
  purpose: "EVERY eTenders notice with its outcome (awarded/cancelled/unreported) — the honest denominator for award coverage; only euro column is the pre-award estimate"

ted_ie_awards:
  grain: "one row per (TED award notice, winner)"
  money_grain: ted
  never_sum_with: awarded|payments|budget
  purpose: "EU TED notice-winner records — values are display-only per notice and never summed"

la_budget_divisions:
  grain: "one row per (council,year,division)"
  money_grain: budget
  never_sum_with: awarded|payments|accounts
  purpose: "ADOPTED council budgets (a PLAN) — the 4th money grain, never union with actuals"

la_afs_divisions:
  grain: "one row per (council,year,division)"
  money_grain: accounts
  never_sum_with: awarded|payments|budget
  purpose: "Audited council revenue accounts (outturn) by service division"

la_afs_capital_divisions:
  grain: "one row per (council,year,division)"
  money_grain: accounts
  never_sum_with: awarded|payments|budget
  purpose: "Audited council CAPITAL accounts — distinct from revenue; never sum the two"

la_afs_balance_sheet:
  grain: "one row per (council,year,item)"
  money_grain: balance_sheet_stock
  never_sum_with: awarded|payments|budget|accounts
  purpose: "AFS Balance Sheet line items (assets/debtors/creditors/loans_payable) — STOCKS/positions, never sum with any spend flow or across years; loans_payable is one item"

la_afs_loan_movement:
  grain: "one row per (council,year,item)"
  money_grain: loan_movement
  never_sum_with: awarded|payments|budget|accounts
  purpose: "AFS Note 7 loan movement — opening/closing STOCKS + borrow/repay FLOWS (reconcile-gated); never sum a flow with a stock or with spend"

afs_amalgamated_divisions:
  grain: "one row per (year,division) national"
  money_grain: accounts
  never_sum_with: awarded|payments|budget
  purpose: "National amalgamated council accounts (all 31 summed) — never mix with per-LA AFS"

public_payments_fact:
  grain: "one row per public-body payment line"
  money_grain: payments
  never_sum_with: awarded|budget|ted
  purpose: "Central/semi-state body payments — same PAYMENTS grain as procurement_payments_fact"

payments_full_psa:
  grain: "one row per PSA payment line"
  money_grain: payments
  never_sum_with: awarded|budget|ted
  purpose: "Full public-service-agreement payments"

# DRIFT (2026-07-17): no `la_councillor_payments` parquet exists in silver/ or gold/
# (the --check drift guard flagged this — it was a dead entry in the legacy CSV too).
# Semantics preserved here; re-enable when the fact lands under this exact stem.
# la_councillor_payments:
#   grain: "one row per (councillor,period,category)"
#   money_grain: allowance
#   never_sum_with: awarded|payments|budget
#   purpose: "s.142 register payments to councillors — an allowance grain, never public spend"

sipo_donations:
  grain: "one row per declared donation"
  money_grain: political_finance
  never_sum_with: expenses|awarded|payments
  purpose: "SIPO political donations — never sum with election expenses"

sipo_expenses_fact:
  grain: "one row per election-expense line"
  money_grain: political_finance
  never_sum_with: donations|awarded|payments
  purpose: "SIPO election expenses — never sum with donations"

# ── Land value sources (added 2026-09-03) ────────────────────────────────────
# FOUR different measurements of "what land costs", each a different grain and
# method. They must never be averaged, differenced or summed across each other,
# and none is a valuation of any specific parcel.

scsi_agri_land_values:
  grain: one row per (survey_year, county, plot-size band, quality)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: SCSI/Teagasc agent-survey AVERAGE agricultural land values EUR/acre (25 counties, Dublin excluded) — survey opinion, not transactions; (c) SCSI, internal analysis only

scsi_agri_land_rental:
  grain: one row per (year, province, land use)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: SCSI/Teagasc agent-survey land RENTAL values EUR/acre by province and use — survey opinion; n/a cells kept as nulls; (c) SCSI, internal analysis only

cso_ara02:
  grain: one row per (STATISTIC, year, NUTS3 region, land type)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: CSO agricultural land sales median/mean EUR per acre and hectare from Revenue stamp-duty returns, 2013-2024 — recorded consideration; excludes development land and parcels under 0.2 ha

cso_rzlpa02:
  grain: one row per (STATISTIC, year, county-or-NUTS3)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: CSO residentially ZONED land prices (transactions, volume, value, median EUR/ha), 2024 only so far — a different market from agricultural land; never difference against ARA02 to price zoning

ipav_farming_report:
  grain: one row per (year, geo, measure)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: IPAV member-auctioneer survey of achieved land sale and rent averages EUR/acre, national and provincial, 2016-2025 — agent-reported, not a register; (c) IPAV, internal analysis only

cso_rzlpa01:
  grain: one row per (STATISTIC, year, NUTS3 region)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: CSO residentially zoned land prices by NUTS3, 2018-2024 — the only multi-year zoned-land series; never difference against agricultural series to price zoning

cso_rzlpa03:
  grain: one row per (STATISTIC, year, NUTS3 region, RZLT status)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: CSO residentially zoned land prices 2024 split by Residential Zoned Land Tax status

cso_rzlpa04:
  grain: one row per (STATISTIC, year, purchaser-or-vendor, participant type)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: CSO residentially zoned land sales 2024 by market participant type (household/company/state) — national only

land_value_index:
  grain: one row per (source, year, geo, land_class, measure, unit)
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: The held land-price sources UNIONED for side-by-side display (SCSI survey, IPAV survey, CSO stamp-duty, CSO zoned) — every row keeps its source and method; rows from different sources are different measurements of different markets and must never be averaged, differenced or summed

fj_land_price_report:
  grain: one row per (year, scope, geo, measure) with a per-row source URL
  money_grain: land_value
  never_sum_with: awarded|payments|budget|land_value
  purpose: Irish Farmers Journal land report figures as republished in FREE coverage only (national averages + published county extremes) — partial by construction, county tables paywalled; Reported band, every row cites its URL
